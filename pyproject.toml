[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "todo-tui"
version = "0.1.0"
description = "A daily task list with points and a scheduled day."
requires-python = ">=3.14"
dependencies = ["textual>=8.2.8,<9", "platformdirs>=4,<5", "rich"]

[project.scripts]
todo = "todo.app:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.hatch.build.targets.wheel]
packages = ["todo"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
