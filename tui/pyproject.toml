[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "todo-tui"
version = "0.1.0"
description = "A daily task list with points and a scheduled day."
requires-python = ">=3.14"
dependencies = ["textual>=8.2.8,<9", "platformdirs>=4,<5", "rich>=15,<16"]

[project.scripts]
todo = "todo.app:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-xdist>=3.8,<4",
]

[tool.hatch.build.targets.wheel]
packages = ["todo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto"
# workers don't inherit -X dev, so leaked connections must fail rather than warn
filterwarnings = [
    "error::ResourceWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
